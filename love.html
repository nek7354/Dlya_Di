<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFE6EE">
<title>Тыкни ♡</title>
<style>
  :root{
    --ink:#4A2C3A;
    --pink:#E86A8A;
    --pink-deep:#C14A6E;
    --pink-soft:#FFD3DE;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    height:100%;
    overflow:hidden;
    font-family: Georgia, "Iowan Old Style", serif;
    color: var(--ink);
    user-select: none;
    -webkit-user-select: none;
  }
  body{
    background: radial-gradient(circle at 50% 40%, #FFF1F5 0%, #FFE0EA 55%, #F8CBD9 100%);
    position: relative;
    touch-action: manipulation;
  }

  /* Холст для частиц */
  #canvas{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  /* Центральный контейнер */
  .stage{
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  /* Надпись на фоне, медленно пульсирует */
  .hint{
    font-size: 15px;
    color: rgba(140, 90, 110, 0.7);
    font-family: ui-monospace, Menlo, monospace;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 24px;
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100% { opacity: 0.55; }
    50%     { opacity: 1; }
  }

  /* Большая кнопка */
  .tap-btn{
    position: relative;
    width: min(78vw, 320px);
    height: min(78vw, 320px);
    border-radius: 50%;
    border: none;
    background:
      radial-gradient(circle at 35% 30%, #FFAEC4 0%, #F58BA6 45%, var(--pink-deep) 100%);
    color: #fff;
    font-family: inherit;
    font-size: 28px;
    font-weight: 700;
    cursor: pointer;
    box-shadow:
      0 20px 60px rgba(193, 74, 110, 0.4),
      inset 0 -8px 24px rgba(140, 20, 60, 0.25),
      inset 0 8px 24px rgba(255, 255, 255, 0.3);
    animation: pulse 2.4s ease-in-out infinite;
    transition: transform 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
  }
  .tap-btn .emoji{
    font-size: 54px;
    line-height: 1;
    filter: drop-shadow(0 4px 8px rgba(140, 20, 60, 0.3));
  }
  .tap-btn .label{
    font-size: 22px;
    letter-spacing: 0.02em;
  }
  .tap-btn .sub{
    font-size: 13px;
    opacity: 0.85;
    font-family: ui-monospace, Menlo, monospace;
    letter-spacing: 0.08em;
  }
  .tap-btn:active{
    transform: scale(0.95);
  }
  @keyframes pulse{
    0%,100% {
      box-shadow:
        0 20px 60px rgba(193, 74, 110, 0.4),
        0 0 0 0 rgba(232, 106, 138, 0.5),
        inset 0 -8px 24px rgba(140, 20, 60, 0.25),
        inset 0 8px 24px rgba(255, 255, 255, 0.3);
    }
    50% {
      box-shadow:
        0 20px 60px rgba(193, 74, 110, 0.5),
        0 0 0 22px rgba(232, 106, 138, 0),
        inset 0 -8px 24px rgba(140, 20, 60, 0.25),
        inset 0 8px 24px rgba(255, 255, 255, 0.3);
    }
  }

  /* Всплывающее послание */
  .message{
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    padding: 26px 30px;
    border-radius: 28px;
    background: #FFFFFF;
    box-shadow: 0 24px 70px rgba(200, 100, 130, 0.35);
    font-size: 26px;
    font-weight: 700;
    color: var(--pink-deep);
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    text-align: center;
    line-height: 1.3;
    max-width: 88vw;
    transition: transform 0.35s cubic-bezier(.2,.9,.3,1.4), opacity 0.3s ease;
  }
  .message.show{
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .message .heart-line{
    display: block;
    font-size: 20px;
    color: var(--pink);
    margin-top: 6px;
    font-weight: 400;
  }

  /* Счётчик тапов в углу */
  .counter{
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(140, 90, 110, 0.55);
    font-family: ui-monospace, Menlo, monospace;
    letter-spacing: 0.1em;
    z-index: 3;
  }

  /* Небольшая рамка из сердечек по краям */
  .corner{
    position: fixed;
    font-size: 22px;
    opacity: 0.55;
    z-index: 1;
    animation: sway 4s ease-in-out infinite;
  }
  .corner.tl{ top: 20px; left: 22px; }
  .corner.tr{ top: 20px; right: 22px; animation-delay: 0.7s; }
  .corner.bl{ bottom: 20px; left: 22px; animation-delay: 1.4s; }
  .corner.br{ bottom: 20px; right: 22px; animation-delay: 2.1s; }
  @keyframes sway{
    0%,100% { transform: rotate(-8deg) translateY(0); }
    50%     { transform: rotate(8deg) translateY(-4px); }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="corner tl">♡</div>
<div class="corner tr">✿</div>
<div class="corner bl">❀</div>
<div class="corner br">♡</div>

<div class="stage">
  <div class="hint" id="hint">нажми на кнопку</div>
  <button class="tap-btn" id="tapBtn">
    <span class="emoji">🌷</span>
    <span class="label">Тыкни сюда</span>
    <span class="sub">и увидишь кое-что</span>
  </button>
</div>

<div class="message" id="message"></div>
<div class="counter" id="counter">тапов: 0</div>

<script>
/* ================== ЧАСТИЦЫ (canvas) ================== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
let particles = [];
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const COLORS = ['#E86A8A', '#C14A6E', '#F58BA6', '#FFD3DE', '#D9A65C', '#FFAEC4', '#FF7BA0'];
const SHAPES = ['heart', 'circle', 'star', 'sparkle'];

function rand(min, max){ return Math.random() * (max - min) + min; }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

/* Взрыв салюта из точки */
function burst(x, y, count){
  count = count || 44;
  for(let i=0;i<count;i++){
    const angle = (Math.PI * 2 * i) / count + rand(-0.15, 0.15);
    const speed = rand(3, 9);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - rand(0, 2),
      g: 0.14,
      life: rand(60, 100),
      maxLife: 100,
      size: rand(5, 12),
      color: pick(COLORS),
      shape: pick(SHAPES),
      rot: rand(0, Math.PI*2),
      rotSpeed: rand(-0.15, 0.15)
    });
  }
}

/* Дополнительный «дождь» из верха */
function rain(count){
  count = count || 20;
  for(let i=0;i<count;i++){
    particles.push({
      x: rand(0, W),
      y: rand(-100, 0),
      vx: rand(-1, 1),
      vy: rand(2, 5),
      g: 0.06,
      life: rand(90, 140),
      maxLife: 140,
      size: rand(6, 12),
      color: pick(COLORS),
      shape: pick(SHAPES),
      rot: rand(0, Math.PI*2),
      rotSpeed: rand(-0.1, 0.1)
    });
  }
}

/* Рисование формы */
function drawHeart(x, y, s, rot, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(s/10, s/10);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 3);
  ctx.bezierCurveTo(-7, -5, -14, 3, 0, 12);
  ctx.bezierCurveTo(14, 3, 7, -5, 0, 3);
  ctx.fill();
  ctx.restore();
}
function drawStar(x, y, s, rot, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  const spikes = 5;
  const outer = s;
  const inner = s * 0.45;
  for(let i=0;i<spikes*2;i++){
    const r = i % 2 === 0 ? outer : inner;
    const a = (Math.PI / spikes) * i - Math.PI/2;
    if(i === 0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawSparkle(x, y, s, rot, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-s, 0); ctx.lineTo(s, 0);
  ctx.moveTo(0, -s); ctx.lineTo(0, s);
  ctx.stroke();
  ctx.restore();
}
function drawCircle(x, y, s, color){
  ctx.beginPath();
  ctx.fillStyle = color;
  ctx.arc(x, y, s*0.5, 0, Math.PI*2);
  ctx.fill();
}

let raf;
function loop(){
  ctx.clearRect(0, 0, W, H);
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.vy += p.g;
    p.vx *= 0.99;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.rotSpeed;
    p.life--;

    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;

    if(p.shape === 'heart') drawHeart(p.x, p.y, p.size, p.rot, p.color);
    else if(p.shape === 'star') drawStar(p.x, p.y, p.size, p.rot, p.color);
    else if(p.shape === 'sparkle') drawSparkle(p.x, p.y, p.size, p.rot, p.color);
    else drawCircle(p.x, p.y, p.size, p.color);

    if(p.life <= 0 || p.y > H + 50){
      particles.splice(i, 1);
    }
  }
  ctx.globalAlpha = 1;
  raf = requestAnimationFrame(loop);
}
loop();

/* ================== СООБЩЕНИЯ ================== */
const messages = [
  { text: 'Хорошего дня Ди', sub: 'Эммм' },
  { text: 'Какая же ты классная', sub: 'просто так, на всякий случай' },
  { text: 'Улыбнись ♡', sub: 'ну пожалуйста' },
  { text: 'Хорошего настроения', sub: 'лалала' },
  { text: 'Ты самая лучшая', sub: 'Банковский эксперт' },
  { text: 'Эм не забывай мне писать', sub: 'я жду' },
  { text: 'Отдохни сегодня', sub: 'посел работы конечно же' },
  { text: 'Когда гулять?', sub: 'ток след неделя я на плотно занят' },
];

const tapBtn = document.getElementById('tapBtn');
const msgEl = document.getElementById('message');
const counterEl = document.getElementById('counter');
const hintEl = document.getElementById('hint');
let tapCount = 0;
let lastIndex = -1;

function showMessage(){
  let idx;
  do { idx = Math.floor(Math.random() * messages.length); }
  while(idx === lastIndex && messages.length > 1);
  lastIndex = idx;

  const m = messages[idx];
  msgEl.innerHTML = m.text + '<span class="heart-line">' + m.sub + '</span>';
  msgEl.classList.add('show');

  clearTimeout(showMessage._t);
  showMessage._t = setTimeout(() => {
    msgEl.classList.remove('show');
  }, 2200);
}

/* ================== ТАП ================== */
let lastTap = 0;

function onTap(x, y){
  /* Вспышка салюта в точке тапа */
  burst(x, y, 46);

  /* Немного «дождя» сверху */
  rain(14);

  /* Вибрация, если есть */
  if(navigator.vibrate) navigator.vibrate([15, 30, 15]);

  /* Сообщение */
  showMessage();

  /* Счётчик */
  tapCount++;
  counterEl.textContent = 'тапов: ' + tapCount;

  if(tapCount === 1) hintEl.textContent = 'ещё разок ♡';
  else if(tapCount === 5) hintEl.textContent = 'тебе идёт считать';
  else if(tapCount === 10) hintEl.textContent = '10! неплохо';
  else if(tapCount === 20) hintEl.textContent = 'ты упорная ♡';
  else if(tapCount === 35) hintEl.textContent = 'дальше только звёзды ✨';
  else if(tapCount > 50) hintEl.textContent = 'ладно, ты победила';

  lastTap = Date.now();
}

tapBtn.addEventListener('click', (e) => {
  e.preventDefault();
  const r = tapBtn.getBoundingClientRect();
  onTap(r.left + r.width/2, r.top + r.height/2);
});

/* Дополнительно: тап в любое место экрана тоже работает */
document.body.addEventListener('click', (e) => {
  if(e.target === tapBtn) return;
  if(e.target.closest('.tap-btn')) return;
  /* Не спамить от двойных кликов по кнопке */
  if(Date.now() - lastTap < 200) return;
  onTap(e.clientX, e.clientY);
});

/* На всякий случай защита от скролла */
document.addEventListener('touchmove', (e) => {
  if(e.scale && e.scale !== 1){ return; }
}, {passive: true});

/* Небольшой салют через 1 секунду после загрузки — для первого впечатления */
setTimeout(() => {
  burst(W/2, H/2, 30);
}, 900);
</script>

</body>
</html>
