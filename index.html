<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFE6EE">
<title>Тыкни :)</title>
<style>
  :root{
    --ink:#4A2C3A;
    --pink:#E86A8A;
    --pink-deep:#C14A6E;
    --pink-soft:#FFD3DE;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    height:100%;
    overflow:hidden;
    font-family: Georgia, "Iowan Old Style", serif;
    color: var(--ink);
    user-select: none;
    -webkit-user-select: none;
  }
  body{
    background: radial-gradient(circle at 50% 40%, #FFF1F5 0%, #FFE0EA 55%, #F8CBD9 100%);
    position: relative;
    touch-action: manipulation;
  }

  #canvas{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  .stage{
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  /* Верхний меняющийся текст */
  /* Плашки-сообщения, вылетающие с боков */
  .flyer-layer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 12;
    overflow: hidden;
  }
  .flyer{
    position: absolute;
    top: 30%;
    padding: 18px 26px;
    border-radius: 22px;
    background: linear-gradient(135deg, #FFFFFF, #FFF0F4);
    color: var(--pink-deep);
    font-size: 22px;
    font-weight: 700;
    line-height: 1.25;
    font-family: inherit;
    text-align: center;
    max-width: 82vw;
    box-shadow:
      0 14px 40px rgba(193, 74, 110, 0.35),
      0 0 0 3px rgba(255, 255, 255, 0.6) inset;
    border: 2px solid var(--pink-soft);
    opacity: 0;
    transform: translateX(-120vw) rotate(-8deg);
    will-change: transform, opacity;
  }
  .flyer.right{ transform: translateX(120vw) rotate(8deg); }
  .flyer.in{ animation: flyInLeft 0.55s cubic-bezier(.2,.9,.3,1.4) forwards; }
  .flyer.right.in{ animation: flyInRight 0.55s cubic-bezier(.2,.9,.3,1.4) forwards; }
  @keyframes flyInLeft{
    0%   { transform: translateX(-120vw) rotate(-14deg); opacity: 0; }
    60%  { transform: translateX(8%) rotate(3deg); opacity: 1; }
    80%  { transform: translateX(-3%) rotate(-2deg); opacity: 1; }
    100% { transform: translateX(0) rotate(-3deg); opacity: 1; }
  }
  @keyframes flyInRight{
    0%   { transform: translateX(120vw) rotate(14deg); opacity: 0; }
    60%  { transform: translateX(-8%) rotate(-3deg); opacity: 1; }
    80%  { transform: translateX(3%) rotate(2deg); opacity: 1; }
    100% { transform: translateX(0) rotate(3deg); opacity: 1; }
  }
  .flyer.out{ animation: flyOutLeft 0.45s ease-in forwards; }
  .flyer.right.out{ animation: flyOutRight 0.45s ease-in forwards; }
  @keyframes flyOutLeft{
    0%   { transform: translateX(0) rotate(-3deg); opacity: 1; }
    100% { transform: translateX(-120vw) rotate(-16deg); opacity: 0; }
  }
  @keyframes flyOutRight{
    0%   { transform: translateX(0) rotate(3deg); opacity: 1; }
    100% { transform: translateX(120vw) rotate(16deg); opacity: 0; }
  }
  .flyer.v2{ background: linear-gradient(135deg, #FFE6EE, #FFD3DE); color: #8B1F45; }
  .flyer.v3{ background: linear-gradient(135deg, #FFF3E0, #FFE2B8); color: #A55A00; border-color: #FFD9A1; }
  .flyer.v4{ background: linear-gradient(135deg, #E6F6EA, #D0EBD8); color: #2F6B45; border-color: #B8DEC4; }

  /* Финальный большой текст */
  .finale{
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    font-size: 34px;
    font-weight: 700;
    color: var(--pink-deep);
    text-align: center;
    line-height: 1.25;
    opacity: 0;
    pointer-events: none;
    z-index: 15;
    text-shadow: 0 4px 20px rgba(193,74,110,0.25);
    transition: transform 0.6s cubic-bezier(.2,.9,.3,1.4), opacity 0.5s ease;
    max-width: 88vw;
  }
  .finale.show{
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .finale .big-heart{
    display: block;
    font-size: 56px;
    margin-bottom: 8px;
    animation: beat 1.2s ease-in-out infinite;
  }
  @keyframes beat{
    0%,100% { transform: scale(1); }
    15%     { transform: scale(1.16); }
    30%     { transform: scale(1); }
    45%     { transform: scale(1.1); }
  }

  .tap-btn{
    position: relative;
    width: min(78vw, 320px);
    height: min(78vw, 320px);
    border-radius: 50%;
    border: none;
    background:
      radial-gradient(circle at 35% 30%, #FFAEC4 0%, #F58BA6 45%, var(--pink-deep) 100%);
    color: #fff;
    font-family: inherit;
    font-size: 28px;
    font-weight: 700;
    cursor: pointer;
    box-shadow:
      0 20px 60px rgba(193, 74, 110, 0.4),
      inset 0 -8px 24px rgba(140, 20, 60, 0.25),
      inset 0 8px 24px rgba(255, 255, 255, 0.3);
    animation: pulse 2.4s ease-in-out infinite;
    transition: transform 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
  }
  .tap-btn .emoji{
    font-size: 54px;
    line-height: 1;
    filter: drop-shadow(0 4px 8px rgba(140, 20, 60, 0.3));
  }
  .tap-btn .label{
    font-size: 22px;
    letter-spacing: 0.02em;
  }
  .tap-btn .sub{
    font-size: 13px;
    opacity: 0.85;
    font-family: ui-monospace, Menlo, monospace;
    letter-spacing: 0.08em;
  }
  .tap-btn:active{
    transform: scale(0.95);
  }
  @keyframes pulse{
    0%,100% {
      box-shadow:
        0 20px 60px rgba(193, 74, 110, 0.4),
        0 0 0 0 rgba(232, 106, 138, 0.5),
        inset 0 -8px 24px rgba(140, 20, 60, 0.25),
        inset 0 8px 24px rgba(255, 255, 255, 0.3);
    }
    50% {
      box-shadow:
        0 20px 60px rgba(193, 74, 110, 0.5),
        0 0 0 22px rgba(232, 106, 138, 0),
        inset 0 -8px 24px rgba(140, 20, 60, 0.25),
        inset 0 8px 24px rgba(255, 255, 255, 0.3);
    }
  }

  .counter{
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(140, 90, 110, 0.55);
    font-family: ui-monospace, Menlo, monospace;
    letter-spacing: 0.1em;
    z-index: 3;
  }

  .corner{
    position: fixed;
    font-size: 22px;
    opacity: 0.55;
    z-index: 1;
    animation: sway 4s ease-in-out infinite;
  }
  .corner.tl{ top: 20px; left: 22px; }
  .corner.tr{ top: 20px; right: 22px; animation-delay: 0.7s; }
  .corner.bl{ bottom: 20px; left: 22px; animation-delay: 1.4s; }
  .corner.br{ bottom: 20px; right: 22px; animation-delay: 2.1s; }
  @keyframes sway{
    0%,100% { transform: rotate(-8deg) translateY(0); }
    50%     { transform: rotate(8deg) translateY(-4px); }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="corner tl">✿</div>
<div class="corner tr">❀</div>
<div class="corner bl">✿</div>
<div class="corner br">❀</div>

<div class="stage">
  <button class="tap-btn" id="tapBtn">
    <span class="emoji">🌷</span>
    <span class="label">Тыкни сюда много раз</span>
    <span class="sub">пжпжпж</span>
  </button>
</div>

<div class="flyer-layer" id="flyerLayer"></div>
<div class="finale" id="finale">
  <span class="big-heart">🎉</span>
  Поздравляю победа<br>ты крутая
</div>
<div class="counter" id="counter">тапов: 0</div>

<script>
/* ================== ЧАСТИЦЫ ================== */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
let particles = [];
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const COLORS = ['#E86A8A', '#C14A6E', '#F58BA6', '#FFD3DE', '#D9A65C', '#FFAEC4', '#FF7BA0'];
const SHAPES = ['heart', 'circle', 'star', 'sparkle'];

function rand(min, max){ return Math.random() * (max - min) + min; }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

function burst(x, y, count, power){
  count = count || 44;
  power = power || 1;
  for(let i=0;i<count;i++){
    const angle = (Math.PI * 2 * i) / count + rand(-0.15, 0.15);
    const speed = rand(3, 9) * power;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - rand(0, 2),
      g: 0.14,
      life: rand(60, 100),
      maxLife: 100,
      size: rand(5, 12),
      color: pick(COLORS),
      shape: pick(SHAPES),
      rot: rand(0, Math.PI*2),
      rotSpeed: rand(-0.15, 0.15)
    });
  }
}

function rain(count){
  count = count || 20;
  for(let i=0;i<count;i++){
    particles.push({
      x: rand(0, W),
      y: rand(-100, 0),
      vx: rand(-1, 1),
      vy: rand(2, 5),
      g: 0.06,
      life: rand(90, 140),
      maxLife: 140,
      size: rand(6, 12),
      color: pick(COLORS),
      shape: pick(SHAPES),
      rot: rand(0, Math.PI*2),
      rotSpeed: rand(-0.1, 0.1)
    });
  }
}

function drawHeart(x, y, s, rot, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(s/10, s/10);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 3);
  ctx.bezierCurveTo(-7, -5, -14, 3, 0, 12);
  ctx.bezierCurveTo(14, 3, 7, -5, 0, 3);
  ctx.fill();
  ctx.restore();
}
function drawStar(x, y, s, rot, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath();
  const spikes = 5;
  const outer = s;
  const inner = s * 0.45;
  for(let i=0;i<spikes*2;i++){
    const r = i % 2 === 0 ? outer : inner;
    const a = (Math.PI / spikes) * i - Math.PI/2;
    if(i === 0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawSparkle(x, y, s, rot, color){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-s, 0); ctx.lineTo(s, 0);
  ctx.moveTo(0, -s); ctx.lineTo(0, s);
  ctx.stroke();
  ctx.restore();
}
function drawCircle(x, y, s, color){
  ctx.beginPath();
  ctx.fillStyle = color;
  ctx.arc(x, y, s*0.5, 0, Math.PI*2);
  ctx.fill();
}

function loop(){
  ctx.clearRect(0, 0, W, H);
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.vy += p.g;
    p.vx *= 0.99;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.rotSpeed;
    p.life--;

    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;

    if(p.shape === 'heart') drawHeart(p.x, p.y, p.size, p.rot, p.color);
    else if(p.shape === 'star') drawStar(p.x, p.y, p.size, p.rot, p.color);
    else if(p.shape === 'sparkle') drawSparkle(p.x, p.y, p.size, p.rot, p.color);
    else drawCircle(p.x, p.y, p.size, p.color);

    if(p.life <= 0 || p.y > H + 50){
      particles.splice(i, 1);
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
}
loop();

/* ================== ХОД ИГРЫ ================== */
const tapBtn = document.getElementById('tapBtn');
const counterEl = document.getElementById('counter');
const finaleEl = document.getElementById('finale');
let tapCount = 0;
let finaleShown = false;

/* Плашки, вылетающие с боков */
const flyerLayer = document.getElementById('flyerLayer');
let currentFlyer = null;
let currentTimeout = null;
let nextSide = 'left';

function spawnFlyer(text, variant){
  if(currentFlyer){
    clearTimeout(currentTimeout);
    const old = currentFlyer;
    old.classList.remove('in');
    old.classList.add('out');
    setTimeout(() => { if(old.parentNode) old.parentNode.removeChild(old); }, 500);
    currentFlyer = null;
  }
  const el = document.createElement('div');
  el.className = 'flyer ' + (variant || '') + (nextSide === 'right' ? ' right' : '');
  el.textContent = text;
  const topPercent = 22 + Math.random() * 16;
  el.style.top = topPercent + '%';
  flyerLayer.appendChild(el);
  currentFlyer = el;
  nextSide = nextSide === 'left' ? 'right' : 'left';
  requestAnimationFrame(() => { el.classList.add('in'); });
  currentTimeout = setTimeout(() => {
    el.classList.remove('in');
    el.classList.add('out');
    setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 500);
    if(currentFlyer === el) currentFlyer = null;
  }, 1500);
}

const stages = [
  { at: 1,  text: 'ещё разок :)',               variant: ''   },
  { at: 5,  text: 'уже веселее',                variant: 'v2' },
  { at: 10, text: 'десять!',                    variant: 'v3' },
  { at: 15, text: 'неплохо идёшь',              variant: 'v4' },
  { at: 20, text: 'давай ещё немного поднажми', variant: ''   },
  { at: 30, text: 'ты в ударе!',                variant: 'v2' },
  { at: 35, text: 'опа-опа, ты уже близко',     variant: 'v3' },
  { at: 42, text: 'ещё чуть-чуть!',             variant: 'v4' }
];

function checkStage(n){
  const st = stages.find(s => s.at === n);
  if(st) spawnFlyer(st.text, st.variant);
}

/* Показать финал */
function showFinale(){
  if(finaleShown) return;
  finaleShown = true;

  /* Убираем текущую плашку */
  if(currentFlyer){
    clearTimeout(currentTimeout);
    const old = currentFlyer;
    old.classList.remove('in');
    old.classList.add('out');
    setTimeout(() => { if(old.parentNode) old.parentNode.removeChild(old); }, 500);
    currentFlyer = null;
  }

  /* Скрываем кнопку плавно */
  tapBtn.style.transition = 'transform 0.8s ease, opacity 0.8s ease';
  tapBtn.style.transform = 'scale(0.6)';
  tapBtn.style.opacity = '0.15';

  /* Показываем финальный текст */
  finaleEl.classList.add('show');

  /* Большой финальный салют — три волны */
  setTimeout(() => {
    burst(W/2, H/2, 60, 1.4);
  }, 200);
  setTimeout(() => {
    burst(W*0.25, H*0.4, 45, 1.2);
    burst(W*0.75, H*0.4, 45, 1.2);
  }, 700);
  setTimeout(() => {
    burst(W*0.5, H*0.3, 50, 1.3);
    rain(30);
  }, 1300);
  setTimeout(() => {
    /* Ещё пара волн, чтобы было ощутимо празднично */
    burst(W*0.3, H*0.5, 40, 1.1);
    burst(W*0.7, H*0.5, 40, 1.1);
    rain(20);
  }, 2000);

  /* Вибрация */
  if(navigator.vibrate) navigator.vibrate([40, 60, 40, 60, 40, 80, 60]);
}

function onTap(x, y){
  /* Салют в точке тапа */
  burst(x, y, 46);
  rain(14);

  if(navigator.vibrate) navigator.vibrate([12, 25, 12]);

  tapCount++;
  counterEl.textContent = 'тапов: ' + tapCount;

 
  checkStage(tapCount);

  /* Финал */
  if(tapCount >= 50){
    showFinale();
  }
}

/* Кнопка */
tapBtn.addEventListener('click', (e) => {
  e.preventDefault();
  if(finaleShown) return;
  const r = tapBtn.getBoundingClientRect();
  onTap(r.left + r.width/2, r.top + r.height/2);
});

/* Тап в любое место экрана */
let lastTapTs = 0;
document.body.addEventListener('click', (e) => {
  if(finaleShown) return;
  if(e.target.closest('.tap-btn')) return;
  if(Date.now() - lastTapTs < 180) return;
  lastTapTs = Date.now();
  onTap(e.clientX, e.clientY);
});

/* Защита от скролла */
document.addEventListener('touchmove', (e) => {
  if(e.touches.length > 1) e.preventDefault();
}, {passive: false});

/* Приветственный салют через секунду */
setTimeout(() => {
  burst(W/2, H/2, 30);
}, 900);
</script>

</body>
</html>
